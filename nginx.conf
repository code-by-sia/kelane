server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets if available
    gzip_static on;

    # Aggressive caching for hashed assets (JS/CSS chunks have content hashes in filenames)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker and manifest must never be cached
    location ~* (service-worker\.js|sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # All other routes fall back to index.html (SPA client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
